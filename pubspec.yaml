    - assets/cut2.png
    - assets/cut3.png
    - assets/cut4.png
    - assets/cut5.png
    - assets/cut6.png
    - assets/cut7.png
    - assets/frac1.png
    - assets/frac2.png
    - assets/frac4.png
    - assets/frac5.png
    - assets/cpr1.png
    - assets/cpr2.png
    - assets/cpr3.png
    - assets/cpr4.png
    - assets/cpr5.png
    - assets/fire1.png
    - assets/fire2.png
    - assets/fire3.png
    - assets/fire4.png
    - assets/fire5.png
    - assets/fire6.png
    - assets/flood1.png
    - assets/flood2.png
    - assets/flood3.png
